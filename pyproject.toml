[project]
name = "wellclear"
version = "0.1.0"
description = """\
    Derivation, exact model, test-vector corpus, and grading tools for a thin \
    thread through the regeneration of the DAIDALUS well-clear detection component.\
    """
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest~=8.3",
    "pytest-cov~=6.0"
]
lint = [
    "pylint~=3.3"
]

[build-system]
requires = [
    "setuptools>=68.0"
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--doctest-modules --cov=wellclear --cov-report term-missing"
testpaths = ["src/wellclear", "tests"]
